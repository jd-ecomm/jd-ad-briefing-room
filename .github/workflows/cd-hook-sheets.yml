name: Creative Discovery hook sheets

# Large-frame sheets (no headline or copy) for reading on-screen text into in_ads.hook_text /
# onscreen_text (scripts/cd_hook_sheets.py). Sheets are pushed to cd-hooks/<set>-bN data branches
# (150 sheets per branch) because artifact downloads are blocked for the reading session.
on:
  workflow_dispatch:
    inputs:
      set:
        description: "Which set"
        required: true
        type: choice
        options: [pilot, all, debug, priority]
      only_unread:
        description: "Skip ads that already have hook_read_at (all only)"
        required: false
        default: "0"

concurrency:
  group: cd-hook-sheets-${{ inputs.set }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and Python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q requests pillow
      - name: Build hook sheets
        env:
          SUPABASE_URL: https://cymkcvdsxoneojfisjgk.supabase.co
          # Public anon key (same as cd-media-copy.yml); read only use here.
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5bWtjdmRzeG9uZW9qZmlzamdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMTg0ODQsImV4cCI6MjEwODY5NDQ4NH0.rgRRRXCab-s5xy4ICFa_l511Gol8EMqPEjBHThnAC9I' }}
          SET: ${{ inputs.set }}
          ONLY_UNREAD: ${{ inputs.only_unread }}
        run: python3 -u scripts/cd_hook_sheets.py
      - uses: actions/upload-artifact@v4
        with:
          name: hooks-${{ inputs.set }}
          path: out/
          retention-days: 7
      - name: Push sheets to data branches (150 sheets per branch)
        run: |
          S="${{ inputs.set }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls out/*.jpg | sort > /tmp/list.txt
          split -l 150 -d -a 2 /tmp/list.txt /tmp/chunk_
          n=0
          for c in /tmp/chunk_*; do
            n=$((n+1)); B="cd-hooks/$S-b$n"; D="/tmp/br$n"
            mkdir -p "$D"; cp "out/${S}_index.json" "$D/"
            xargs -a "$c" cp -t "$D/"
            (cd "$D" && git init -q -b "$B" && git add -A && git commit -q -m "Hook sheets $B (run ${{ github.run_id }})" \
              && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$B:$B")
          done
          echo "branches=$n"
