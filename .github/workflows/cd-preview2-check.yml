name: Creative Discovery preview2 check

# Runs Playwright (chromium) against the deployed /preview/ page with live Supabase and R2 data,
# at 1440x900 and 390x844. Waits until GitHub Pages serves this commit's preview2/cd-app.js first.
# Screenshots + results.json are uploaded as an artifact and also pushed to a cd-preview2-shots/run-<id> branch
# so a Claude session without artifact download can read them with git.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site root"
        required: false
        default: "https://jd-ecomm.github.io/jd-ad-briefing-room/"

concurrency:
  group: cd-preview2-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          # Google Chrome (Chromium based) plays the H.264 ads; Playwright's bundled Chromium has no proprietary codecs
          npx playwright install chrome
      - name: Wait for Pages to serve this commit's preview
        env:
          BASE: ${{ inputs.base_url }}
        run: |
          want=$(md5sum preview2/cd-app.js | cut -d' ' -f1)
          for i in $(seq 1 60); do
            got=$(curl -fsSL "${BASE}preview2/cd-app.js?nocache=$RANDOM$i" | md5sum | cut -d' ' -f1 || true)
            if [ "$got" = "$want" ]; then echo "Pages is serving this commit's preview (try $i)"; exit 0; fi
            echo "waiting for Pages ($i): $got vs $want"; sleep 20
          done
          echo "Pages never served this commit's preview2/cd-app.js"; exit 1
      - name: Run the check
        env:
          BASE: ${{ inputs.base_url }}
          PW_CHANNEL: chrome
        # A failed check never fails the job (no failure emails): PASS/FAIL goes to the step summary and results.json.
        run: |
          node tools/cd-preview2-check.js "$BASE" cd-shots || echo "Some checks failed; see the summary"
          test -f cd-shots/results.json || { echo "::error::The check produced no results.json"; exit 1; }
      - name: Write the summary
        if: always()
        run: |
          [ -f cd-shots/results.json ] || exit 0
          node -e '
            const r=require("./cd-shots/results.json");
            const out=[`## Creative Discovery preview2 check`,``,`**${r.passed} passed, ${r.failed} failed** against ${r.base} (${r.when})`,``,`| | Check | Detail |`,`|---|---|---|`];
            for(const x of r.results) out.push(`| ${x.pass?"PASS":"FAIL"} | ${x.name.replace(/\|/g,"/")} | ${String(x.detail||"").slice(0,160).replace(/\|/g,"/").replace(/\n/g," ")} |`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,out.join("\n")+"\n");'
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-preview2-shots
          path: cd-shots
          if-no-files-found: warn
      - name: Push screenshots to a run branch
        if: always()
        run: |
          [ -d cd-shots ] || exit 0
          b="cd-preview2-shots/run-${{ github.run_id }}"
          mkdir -p /tmp/shots && cp -r cd-shots/. /tmp/shots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$b"
          git rm -rqf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/shots/. .
          git add -A
          git commit -qm "Creative Discovery preview2 check screenshots (run ${{ github.run_id }})"
          git push -q origin "$b"
          echo "Pushed $b"
