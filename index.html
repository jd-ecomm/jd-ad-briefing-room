<style>
/* Layout: CRM-style workspace. Sticky header + tabs, filter rail left, card grid, detail drawer right. JD v2, dark-first. */
@font-face{font-family:'FF';src:url('fonts/ForeverForwardSans-Headline.woff2') format('woff2');font-display:swap}
:root{
  --bg:#000;--s1:#121212;--s2:#1B1B1B;--s3:#242424;--line:#2E2E2E;--line2:#3D3D3D;
  --fg:#FFFFFF;--fg2:#CCCCCC;--mut:#8A8B8C;--y:#FFDE14;--y2:#EFFF04;--teal:#43D5B0;--onY:#000;
  --display:'FF','Arial Narrow',Impact,sans-serif;--body:'Inter Tight','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#F2F2F2;--s1:#FFFFFF;--s2:#F7F7F7;--s3:#ECECEC;--line:#E0E0E0;--line2:#CCCCCC;--fg:#000;--fg2:#2E2E2E;--mut:#6F6F6F;color-scheme:light}}
:root[data-theme="light"]{--bg:#F2F2F2;--s1:#FFFFFF;--s2:#F7F7F7;--s3:#ECECEC;--line:#E0E0E0;--line2:#CCCCCC;--fg:#000;--fg2:#2E2E2E;--mut:#6F6F6F;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
.shop{display:inline-flex;align-items:center;gap:3px;font:700 10px/1 var(--body);color:#95BF47;border:1px solid #95BF4766;border-radius:3px;padding:2px 4px;vertical-align:middle;margin-left:6px;letter-spacing:.02em}
.shop svg{width:10px;height:11px}
.amet{display:flex;flex-wrap:wrap;gap:4px 8px;font:600 11px/1.3 var(--body);color:var(--fg2);margin-top:6px}
.amet span{white-space:nowrap}
.pl{display:inline-flex;gap:3px;flex-wrap:wrap}.pl i{font-style:normal;font:700 10px/1 var(--body);border:1px solid var(--line,#444);border-radius:3px;padding:2px 4px;color:var(--fg)}
.atd{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.atd div{border:1px solid var(--line,#333);border-radius:6px;padding:8px 10px;min-width:0}
.atd b{display:block;font:800 16px/1.2 var(--body);margin-top:3px;word-break:break-word}
html,body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--y)}
a{color:inherit}
.disp{font-family:var(--display);text-transform:uppercase;line-height:.77;letter-spacing:-.02em;font-weight:400}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* hero */
.hero{background:var(--y);color:#000}
.hero .wrap{padding-block:40px 36px;display:flex;align-items:flex-end;gap:20px}
.hero h1{font-size:clamp(44px,7vw,84px);margin:0;flex:1;min-width:0;text-wrap:balance}
.hero h1 span{display:block}
.hero h1 span+span{margin-left:.136em}
.hero .meta{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-align:right;line-height:1.5}
.hero .rnd{width:64px;height:64px;flex:none;position:relative;padding-left:22px;margin-right:clamp(8px,2vw,28px)}
.hero .rnd::before{content:"";position:absolute;left:6px;top:-4px;bottom:-4px;width:2px;background:#000;transform:skewX(-10deg)}
.hero svg{width:64px;height:64px;display:block;color:#000}
.spine{background:var(--y);color:#000;border-radius:14px;padding:22px 24px}
.hh{font-size:clamp(36px,5vw,56px);margin:18px 0 0;color:var(--fg)}
.tier{display:inline-block;width:26px;height:26px;border-radius:50%;text-align:center;line-height:26px;font-weight:800}
.tier.t1{background:var(--y);color:#000}.tier.t2{background:var(--teal);color:#000}.tier.t3{background:var(--s3);color:var(--fg)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px}
.theme{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.theme .lines{display:grid;gap:10px;margin:14px 0 12px}
.mths{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px}
.mth{flex:none;width:92px;text-decoration:none;color:var(--fg2);font:700 10px var(--body)}
.mth img{width:92px;height:115px;object-fit:cover;border-radius:6px;display:block;background:#0a0a0a;margin-bottom:4px}
/* projects */
.proj{background:#000;color:#fff;border-bottom:1px solid var(--line)}
.proj .wrap{display:flex;gap:8px;align-items:center;padding-block:10px;flex-wrap:wrap}
.proj .lbl{color:#8A8B8C;margin-right:6px}
.pj{font:700 12px var(--body);border-radius:8px;padding:8px 12px;border:1px solid #3D3D3D;background:#121212;color:#fff;display:inline-flex;gap:8px;align-items:center}
.pj.on{background:var(--y);color:#000;border-color:var(--y)}
.pj.soon{opacity:.5;border-style:dashed}
.pj i{font-style:normal;font-weight:500;opacity:.7}
/* copy-only card */
.cthumb{position:absolute;inset:0;background:var(--s2);padding:16px;display:flex;flex-direction:column;gap:10px;justify-content:flex-end;border-bottom:3px solid var(--y)}
.cthumb .cb1{font-family:var(--display);text-transform:uppercase;font-size:34px;line-height:.82;color:var(--fg);text-wrap:balance}
.cthumb .cb2{font-size:11.5px;line-height:1.4;color:var(--fg2);display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.cthumb .cb0{font:800 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--y)}
:root[data-theme="light"] .cthumb .cb0{color:#000}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .cthumb .cb0{color:#000}}
.sig{font:800 10px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px;background:var(--teal);color:#000}
.sig.m{background:var(--s3);color:var(--fg)}
.sec{display:flex;flex-direction:column;gap:6px}
.sec ul{margin:0;padding-left:18px;line-height:1.45;font-size:13px;color:var(--fg2)}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sw .ok li::marker{color:var(--teal)}
.sw .no li::marker{color:#FF6B6B}
.watch{display:flex;gap:12px;align-items:center;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--fg2);line-height:1.4}
/* tabs */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:8px;align-items:center;padding-block:10px;flex-wrap:wrap}
.pill{font:600 11.5px var(--body);text-transform:uppercase;letter-spacing:.06em;background:var(--s2);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.pill:hover{border-color:var(--line2)}
.pill[aria-pressed="true"],.pill.on{background:var(--y);color:var(--onY);border-color:var(--y)}
.pill:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.sp{flex:1}
#q{background:var(--s2);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:9px 14px;font:500 13px var(--body);width:min(280px,100%)}
/* library */
.lib{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;padding-block:18px}
.rail{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 90px);overflow:auto;display:flex;flex-direction:column;gap:16px;padding-right:4px}
.fg h4{margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 11px var(--body);background:var(--s1);border:1px solid var(--line);color:var(--fg2);border-radius:999px;padding:6px 10px;cursor:pointer}
.chip.on{background:var(--y);color:#000;border-color:var(--y)}
.chip small{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.summary{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;margin-bottom:14px}
.summary .n{font-family:var(--display);font-size:44px;line-height:.8;color:var(--y)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;color:inherit;font:inherit}
.card:hover{border-color:var(--line2)}
.thumb{position:relative;aspect-ratio:9/14;background:#0a0a0a;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img,.thumb video{width:100%;height:100%;object-fit:contain;display:block}
.badge{position:absolute;z-index:3;top:8px;left:8px;display:flex;gap:4px}
.b{font:800 10px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px;background:rgba(0,0,0,.75);color:#fff}
.b.v{background:var(--y);color:#000}
.star{position:absolute;z-index:3;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;cursor:pointer}
.star.on{background:var(--y);color:#000}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cb .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sid{font:800 12px var(--body);letter-spacing:.04em;color:var(--y)}
:root[data-theme="light"] .sid{color:#000;background:var(--y);padding:0 4px}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .sid{color:#000;background:var(--y);padding:0 4px}}
.brand{font-weight:700;font-size:13px}
.copy{color:var(--fg2);font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.t{font:600 10px var(--body);border:1px solid var(--line2);color:var(--fg2);border-radius:4px;padding:2px 5px}
.t.p{border-color:var(--y);color:var(--y)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .t.p{color:#000;background:var(--y)}}
:root[data-theme="light"] .t.p{color:#000;background:var(--y)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--s1);border-left:1px solid var(--line);z-index:41;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px}
.dgrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;margin-top:14px}
.dmedia{background:#0a0a0a;border-radius:12px;overflow:hidden}
.dmedia img,.dmedia video{width:100%;display:block}
.dh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dh .disp{font-size:52px;color:var(--y)}
:root[data-theme="light"] .dh .disp{color:#000}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .dh .disp{color:#000}}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:13px}
.kv dt{color:var(--mut);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0}
.quote{background:var(--s2);border-left:3px solid var(--y);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px;line-height:1.45}
.btn{display:inline-flex;align-items:center;gap:6px;font:800 11.5px var(--body);text-transform:uppercase;letter-spacing:.06em;padding:10px 14px;border-radius:999px;background:var(--fg);color:var(--bg);border:0;cursor:pointer;text-decoration:none}
.btn.y{background:var(--y);color:#000}
.btn.g{background:var(--s3);color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* matrix */
.mx{padding-block:20px;display:flex;flex-direction:column;gap:18px}
.offer{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.ocard{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:16px}
.ocard .disp{font-size:40px;color:var(--y);margin-top:6px}
:root[data-theme="light"] .ocard .disp{color:#000}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .ocard .disp{color:#000}}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
th{position:sticky;top:0;background:var(--s2);text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
td .hl{font-family:var(--display);font-size:24px;line-height:.85;text-transform:uppercase}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--y);color:#000;font:800 10px var(--body);text-align:center;line-height:22px}
.dot.off{background:transparent;border:1px dashed var(--line2)}
.cnt{font-variant-numeric:tabular-nums;color:var(--mut);font-size:12px}
/* studio */
.st{padding-block:20px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;align-items:start}
.scard{background:var(--s1);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;padding:0;color:inherit;font:inherit;text-align:left}
.scard img{width:100%;display:block;aspect-ratio:4/5;object-fit:contain;background:#0a0a0a}
.scard .brand{font-size:12.5px;line-height:1.3}
.note{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--fg2);line-height:1.5;max-width:900px}
.note b{color:var(--fg)}
/* ours */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font-family:var(--display);font-size:52px;line-height:.8;margin-top:8px}
.flag{color:var(--mut);font-size:11px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--y);color:#000;font-weight:800;padding:10px 16px;border-radius:999px;z-index:60}
@media (max-width:820px){
  .lib{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .fg{min-width:230px}
  .dgrid{grid-template-columns:minmax(0,1fr)}
  .dmedia{max-width:360px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .hero .meta{font-size:10px;letter-spacing:.04em}
}
/* Interactive cards: lift, yellow glow, cursor spotlight, hover previews */
.card,.scard{position:relative;isolation:isolate}
.card::after,.scard::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;z-index:4;background:radial-gradient(240px circle at var(--mx,50%) var(--my,30%),rgba(255,222,20,.18),transparent 62%)}
.card:hover,.scard:hover,.card:focus-visible,.scard:focus-visible,.card.live{border-color:var(--y);box-shadow:0 0 0 1px var(--y),0 16px 44px -10px rgba(255,222,20,.45)}
.card:hover::after,.scard:hover::after{opacity:1}
.thumb .pv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0a0a0a;opacity:0;z-index:1}
.thumb.playing .pv{opacity:1}
.thumb .pbar{position:absolute;left:10px;right:10px;bottom:9px;height:3px;border-radius:2px;background:rgba(255,255,255,.25);z-index:3;opacity:0;overflow:hidden}
.thumb .pbar i{display:block;height:100%;width:0;background:var(--y)}
.thumb.playing .pbar,.thumb.panning .pbar{opacity:1}
.thumb .mute{position:absolute;right:8px;bottom:18px;z-index:3;font:800 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.72);color:#fff;border-radius:999px;padding:6px 9px;opacity:0}
.thumb.playing .mute{opacity:1}
.thumb.pan.panning img{transform:scale(1.04)}
.scard .sm{position:relative;overflow:hidden;aspect-ratio:9/14;background:#0a0a0a}
.scard .sm img{width:100%;height:100%;object-fit:contain;aspect-ratio:auto}
.scard:hover .sm img{transform:scale(1.04)}
.hovhint{position:absolute;left:8px;bottom:8px;z-index:3;font:800 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;background:var(--y);color:#000;border-radius:999px;padding:5px 8px;opacity:0}
.thumb.pan .hovhint{opacity:1}
@media (prefers-reduced-motion:no-preference){
 .card,.scard{transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .25s}
 .card:hover,.scard:hover{transform:translateY(-4px)}
 .card::after,.scard::after{transition:opacity .2s}
 .thumb .pv,.thumb .mute,.thumb .pbar,.hovhint{transition:opacity .25s}
 .thumb.pan img,.scard .sm img{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
}
</style>

  <button class="pill" data-tab="house" id="t-house">Message Themes</button>

      <aside class="rail" id="rail" aria-label="Filters"></aside>

        <div class="summary">
          <span class="n" id="count">0</span><span class="lbl" id="countlbl">ads</span>

<script>
const $=s=>document.querySelector(s);
let D, M, ANG={}, STY={}, PH={}, VAR={};
const state={brand:new Set(),lang:new Set(),signal:new Set(),src:new Set(),format:new Set(),group:new Set(),styles:new Set(),angles:new Set(),phases:new Set(),q:'',star:false,mg:'All'};
let stars=new Set();
try{stars=new Set(JSON.parse(localStorage.getItem('bfcm-stars')||'[]'))}catch(e){}
const saveStars=()=>{try{localStorage.setItem('bfcm-stars',JSON.stringify([...stars]))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,1600)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copied '+t)}catch(e){toast('Copy failed. ID: '+t)}}
function linkFor(id){const u=location.href.split('#')[0];return u+'#'+id}

fetch('data.json',{cache:'no-cache'}).then(r=>r.json()).then(j=>{D=j;M=j.matrix;
  M.angles.forEach(a=>ANG[a.id]=a);(M.variations?.rows||[]).forEach(v=>VAR[v.id]=v);M.styles.forEach(s=>STY[s.id]=s);M.phases.forEach(p=>PH[p.id]=p);
  buildRail();renderHouse();renderMessaging();renderStudio();renderOurs();route();});

/* ---------- library ---------- */
const LANG=i=>(i.lang||'').startsWith('EN')?'English':'Other languages';
const SHOPSVG='<svg viewBox="0 0 20 22" aria-hidden="true"><path fill="#95BF47" d="M17.5 4.3c0-.1-.1-.2-.2-.2l-2-.1-1.6-1.6c-.1-.1-.4-.1-.5 0l-.7.2C12 1.6 11.3.6 10 .6h-.1C9.5.1 9 0 8.6 0 5.6 0 4.1 3.8 3.7 5.7l-2.1.6c-.6.2-.7.2-.7.8L-.8 19.9 12.4 22l7.1-1.5S17.5 4.4 17.5 4.3z"/><path fill="#fff" d="M10.3 7.6l-.8 2.4s-.8-.4-1.8-.4c-1.5 0-1.5.9-1.5 1.2 0 1.3 3.3 1.7 3.3 4.7 0 2.3-1.5 3.8-3.4 3.8-2.4 0-3.5-1.5-3.5-1.5l.6-2.1s1.2 1.1 2.3 1.1c.7 0 1-.5 1-1 0-1.7-2.7-1.7-2.7-4.5 0-2.3 1.7-4.6 5-4.6 1.3 0 1.5.9 1.5.9z"/></svg>';
const shopB=i=>i.shopify?`<span class="shop" title="Shopify store">${SHOPSVG}Shopify</span>`:'';
const PLAB={'FB':'FB','IG':'IG','AN':'AN','Messenger':'MSG','Threads':'THR','Instagram':'IG','TikTok':'TT'};
const plats=i=>(i.platforms&&i.platforms!=='n/a'?i.platforms.split(/,\s*/):[]).map(x=>PLAB[x]||x);
const runLbl=i=>i.days==null?'':(i.days?`${i.days}d live`:'<1d live');
const reuseLbl=i=>i.variants==null?'':(i.variants>1?`×${i.variants} reuse`:'Unique');
const PRIB=new Set(['JD Sports','Gymshark','Alo Yoga','Comfrt','lululemon',"Arc'teryx",'Represent','SKIMS','Vuori','Abercrombie & Fitch','Salomon','HAVEN','Bandit Running']);
const isPan=i=>!i.mp4&&!!i.img&&(i.format==='Carousel'||i.cards>1);
const FACETS=[['brand','Brand',i=>[i.brand]],['lang','Language',i=>[LANG(i)]],['signal','Performance signal',i=>[i.signal||'n/a']],['src','Source',i=>[i.src]],['format','Format',i=>[i.video?'Video':'Static / carousel']],['group','Brand group',i=>[i.group]],['phases','Phase fit',i=>i.phases],['angles','Message angle',i=>i.angles],['styles','Creative style',i=>i.styles]];
const label=(k,v)=>k==='angles'?ANG[v]?.name:k==='styles'?STY[v]?.name:k==='phases'?(PH[v]?.name+' · '+PH[v]?.dates):v;
function buildRail(){
  $('#rail').innerHTML=FACETS.map(([k,t,f])=>{const c={};D.items.forEach(i=>f(i).forEach(v=>c[v]=(c[v]||0)+1));
    let keys=Object.keys(c);keys.sort((a,b)=>k==='phases'?a.localeCompare(b):k==='lang'?(a==='English'?-1:1):k==='brand'?((PRIB.has(b)-PRIB.has(a))||c[b]-c[a]):c[b]-c[a]);
    return `<div class="fg"><h4 class="lbl">${t}</h4><div class="chips">${keys.map(v=>`<button class="chip" data-k="${k}" data-v="${esc(v)}">${esc(label(k,v))}<small>${c[v]}</small></button>`).join('')}</div></div>`}).join('');
  $('#rail').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const s=state[b.dataset.k];s.has(b.dataset.v)?s.delete(b.dataset.v):s.add(b.dataset.v);b.classList.toggle('on');renderGrid()};
}
function match(i){
  if(i.archived)return false;
  for(const [k,,f] of FACETS){const s=state[k];if(s.size&&!f(i).some(v=>s.has(v)))return false}
  if(state.star&&!stars.has(i.sid))return false;
  if(state.q){const h=[i.sid,i.brand,i.copy,i.note,i.market,i.headline,i.summary,i.why,i.landing?.label,...i.angles.map(a=>ANG[a]?.name),...i.styles.map(s=>STY[s]?.name)].join(' ').toLowerCase();if(!h.includes(state.q))return false}
  return true}
function renderGrid(){
  const L=D.items.filter(match);$('#count').textContent=L.length;$('#countlbl').textContent=L.length===1?'ad':'ads';
  const v=L.filter(i=>i.video).length;$('#mix').textContent=`${v} video · ${L.length-v} static`;
  $('#grid').innerHTML=L.length?L.map(card).join(''):`<p class="note">No ads match these filters. Clear a filter to widen the set.</p>`;
}
function card(i){return `<div class="card" data-id="${i.sid}" role="button" tabindex="0">
  <div class="thumb${isPan(i)?' pan':''}"${i.mp4?` data-mp4="${i.mp4}"`:''}>${i.mp4?'<div class="pbar"><i></i></div>':''}${i.mp4?'<span class="mute">🔇 Preview</span>':''}${isPan(i)?`<span class="hovhint">${i.cards>1?i.cards+' cards':'Carousel'}</span>`:''}${i.img?`<img loading="lazy" src="${i.img}" alt="${esc(i.brand)} ad ${i.sid}">`:`<div class="cthumb"><div class="cb0">${esc(i.brand)}</div><div class="cb1">${esc(i.headline||'')}</div><div class="cb2">${esc(i.copy)}</div></div>`}
   <div class="badge">${i.video?'<span class="b v">▶ Video</span>':`<span class="b">${esc(i.format)}</span>`}${i.copyonly?'<span class="b">Copy + link</span>':''}${i.signal==='High'?'<span class="sig">High</span>':''}</div>
   <button class="star ${stars.has(i.sid)?'on':''}" data-star="${i.sid}" aria-label="Shortlist ${i.sid}">★</button></div>
  <div class="cb"><div class="top"><span class="sid">${i.sid}</span><span class="lbl">${esc(i.market||'')}</span></div>
   <div class="brand">${esc(i.brand)}${shopB(i)}</div><div class="copy">${esc(i.copy)}</div>${i.src==='Atria'?`<div class="amet">${plats(i).length?`<span class="pl">${plats(i).map(x=>`<i>${x}</i>`).join('')}</span>`:''}${i.date?`<span>${i.date.slice(5).replace('-','/')}${i.end&&i.end!==i.date?'–'+i.end.slice(5).replace('-','/'):''}</span>`:''}${runLbl(i)?`<span>${runLbl(i)}</span>`:''}${reuseLbl(i)?`<span>${reuseLbl(i)}</span>`:''}${i.reach?`<span>Reach ${Number(i.reach)>=1e6?(i.reach/1e6).toFixed(1)+'M':Math.round(i.reach/1e3)+'K'}</span>`:''}</div>`:''}
   <div class="tags">${i.phases.map(p=>`<span class="t p">${p}</span>`).join('')}${i.angles.slice(0,2).map(a=>`<span class="t">${esc(ANG[a]?.name)}</span>`).join('')}</div></div></div>`}
$('#grid').addEventListener('click',e=>{const s=e.target.closest('[data-star]');if(s){e.stopPropagation();const id=s.dataset.star;stars.has(id)?stars.delete(id):stars.add(id);saveStars();s.classList.toggle('on');if(state.star)renderGrid();return}
  const c=e.target.closest('.card');if(c)location.hash=c.dataset.id});
$('#grid').addEventListener('keydown',e=>{if(e.key==='Enter'){const c=e.target.closest('.card');if(c)location.hash=c.dataset.id}});
$('#q').addEventListener('input',e=>{state.q=e.target.value.trim().toLowerCase();if(location.hash.slice(1)!=='library'&&!/^[A-Z]{2}-/.test(location.hash.slice(1)))location.hash='library';renderGrid()});
$('#starOnly').onclick=e=>{state.star=!state.star;e.target.setAttribute('aria-pressed',state.star);renderGrid()};
$('#clear').onclick=()=>{FACETS.forEach(([k])=>state[k].clear());document.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));renderGrid()};

/* ---------- drawer ---------- */

     <dt>Style</dt><dd>${s.styles.map(x=>esc(STY[x]?.name)).join(', ')}</dd><dt>Angle</dt><dd>${s.angles.map(a=>esc(ANG[a]?.name)).join(', ')}</dd>
     <dt>Use in</dt><dd>${s.phases.map(p=>`<span class="t p">${p}</span> ${esc(PH[p]?.name)} (${esc(PH[p]?.dates)})`).join('<br>')}</dd>

    <div class="quote">Example only. Product prices are placeholders until pricing lands on 10 Nov. French version to be briefed for every asset.</div>

}

function renderHouse(){const H=D.house;if(!H)return;const S=Object.fromEntries(D.studio.map(x=>[x.sid,x]));
  const mx=Math.max(...H.personas.map(p=>Math.max(p.bfcm,p.l90)));

  const thumbs=ids=>ids.map(id=>S[id]?`<a href="#${id}" class="mth" title="${esc(S[id].title)}"><img loading="lazy" src="studio/${S[id].file}.jpg" alt="${esc(S[id].title)}"><span>${id}</span></a>`:'').join('');
  $('#v-house').innerHTML=`
  <div class="spine"><div class="lbl" style="color:#000;margin-bottom:14px">The spine · on every asset</div>
   <div class="disp" style="font-size:clamp(40px,6vw,76px)">${esc(H.spine.bf)}</div>
   <div class="row" style="gap:18px;margin-top:10px;font-weight:700"><span>CM: ${esc(H.spine.cm)}</span><span style="opacity:.7">FR: ${esc(H.spine.fr_bf)}</span></div>
   <p style="margin:10px 0 0;max-width:760px">${esc(H.spine.rule)}</p></div>
  <h3 class="disp hh">Who we're talking to</h3>
  <div class="note">${esc(H.personas_note)}</div>
  <div class="tbl"><table style="min-width:980px"><thead><tr><th>Tier</th><th>Persona</th><th>BFCM 2025 share</th><th>Last 90 days</th><th>Search demand</th><th>Hero products</th><th>What it means</th><th>Mockups</th></tr></thead><tbody>
  ${H.personas.map(p=>`<tr><td><span class="tier t${p.tier}">${p.tier}</span></td><td><b>${esc(p.name)}</b></td><td>${bar(p.bfcm,'var(--y)')}</td><td>${bar(p.l90,'var(--teal)')}</td><td class="cnt" style="min-width:170px">${esc(p.search)}</td><td style="min-width:170px">${esc(p.heroes)}</td><td style="min-width:260px;color:var(--fg2)">${esc(p.read)}</td><td><div class="row" style="gap:4px">${p.mock.map(m=>`<a class="pill" href="#${m}" style="text-decoration:none">${m}</a>`).join('')}</div></td></tr>`).join('')}
  </tbody></table></div>
  <h3 class="disp hh">The ten themes</h3>
  <div class="themes">${H.themes.map(t=>`<article class="theme">
    <div class="row" style="justify-content:space-between"><span class="lbl">${t.id}</span><span>${t.phases.map(p=>`<span class="t p">${p}</span>`).join(' ')}</span></div>
    <h4 class="disp" style="font-size:44px;margin:6px 0 4px">${esc(t.name)}</h4>
    <p style="margin:0;font-weight:600">${esc(t.job)}</p>
    <p class="cnt" style="margin:4px 0 0">${esc(t.audience)}</p>
    <div class="lines">${t.lines.map(([en,fr])=>`<div><div class="disp" style="font-size:24px">${esc(en)}</div><div class="cnt">FR · ${esc(fr)}</div></div>`).join('')}</div>
    <div class="quote">${esc(t.primary)}</div>
    <div class="sw" style="margin-top:10px"><div class="sec ok"><div class="lbl">Do</div><ul>${t.do.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="sec no"><div class="lbl">Don't</div><ul>${t.dont.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
    <dl class="kv" style="margin-top:10px"><dt>Land on</dt><dd>${esc(t.lp)}</dd><dt>Angles</dt><dd>${t.angles.map(a=>esc(ANG[a]?.name||a)).join(' · ')}</dd><dt>References</dt><dd>${t.refs.map(r=>`<a href="#${r}">${r}</a>`).join(' · ')}</dd></dl>
    <div class="lbl" style="margin-top:12px">JD mockups</div><div class="mths">${thumbs(t.mock)}</div>
  </article>`).join('')}</div>
  <h3 class="disp hh">What runs when</h3>
  <div class="tbl"><table style="min-width:760px"><thead><tr><th>Theme</th>${M.phases.map(p=>`<th>${p.id} ${esc(p.name)}<br><span style="text-transform:none;letter-spacing:0;font-weight:500">${esc(p.dates)}</span></th>`).join('')}</tr></thead><tbody>
  ${H.themes.map(t=>`<tr><td><b>${t.id}</b> ${esc(t.name)}</td>${M.phases.map(p=>`<td><span class="dot ${t.phases.includes(p.id)?'':'off'}">${t.phases.includes(p.id)?'●':''}</span></td>`).join('')}</tr>`).join('')}
  </tbody></table></div>`;
}
/* ---------- studio ---------- */
function renderStudio(){
  const groups=['All',...new Set(D.studio.map(s=>s.group))], L=D.studio.filter(s=>state.mg==='All'||s.group===state.mg);
  $('#v-studio').innerHTML=`<div class="note" style="margin-bottom:14px"><b>${D.studio.length} JD mockups, ready to brief.</b> Built from real jdsports.ca products (chosen from our top sellers by persona) with placeholder prices (about 40% off; Jordan 4 and Sabrina 3 GS show today's real markdowns) until pricing lands on 10 Nov. Each maps to an angle in the matrix, and brand, category and gifting mockups link to their Verde search-demand line. Swap products and prices when merch confirms, and brief French versions of every asset (two FR examples included).</div>
  <div class="row" style="margin-bottom:14px">${groups.map(g=>`<button class="pill" data-mg="${esc(g)}" aria-pressed="${state.mg===g}">${esc(g)} <span class="cnt">${g==='All'?D.studio.length:D.studio.filter(s=>s.group===g).length}</span></button>`).join('')}</div>
  <div class="sgrid">${L.map(s=>`<button class="scard" data-id="${s.sid}"><div class="sm${s.size.includes('1920')?' tall':''}"><img loading="lazy" src="studio/${s.file}.jpg" alt="${esc(s.title)}"></div><div class="cb"><div class="top"><span class="sid">${s.sid}</span><span class="lbl">${s.size}</span></div><div class="brand">${esc(s.title)}</div><div class="tags"><span class="t">${esc(s.group)}</span>${s.phases.map(p=>`<span class="t p">${p}</span>`).join('')}</div></div></button>`).join('')}</div>`;
  $('#v-studio').onclick=e=>{const g=e.target.closest('[data-mg]');if(g){state.mg=g.dataset.mg;renderStudio();return}const c=e.target.closest('.scard');if(c)location.hash=c.dataset.id};
}
/* ---------- ours ---------- */
function renderOurs(){
  const o=D.own, cat=o.rows.filter(r=>r.type==='Catalogue');
  const sum=(a,k)=>a.reduce((s,r)=>s+r[k],0), tot=sum(o.rows,'spend');
  const f=n=>'$'+Math.round(n).toLocaleString('en-CA');
  $('#v-ours').innerHTML=`<div class="note"><b>JD Canada Meta, ${esc(o.range)}.</b> Ads with spend in the Black Friday window. Meta-attributed results, so treat ROAS as directional. Co-op rows marked * show ROAS far above the account norm, which points to view-through attribution, not real lift.</div>
  <div class="kpis"><div class="kpi"><div class="lbl">Spend (these ads)</div><div class="v">${f(tot)}</div></div>
   <div class="kpi"><div class="lbl">Catalogue share of spend</div><div class="v">${Math.round(sum(cat,'spend')/tot*100)}%</div></div>
   <div class="kpi"><div class="lbl">Best catalogue line</div><div style="font-weight:800;margin-top:10px">"Don't miss our biggest sale of the year."</div><div class="cnt">ROAS 14.1 · CTR 8.15% on prospecting</div></div></div>
  <div class="tbl"><table style="min-width:760px"><thead><tr><th>Ad</th><th>Type</th><th>Copy</th><th class="num">Spend</th><th class="num">ROAS</th><th class="num">Purchases</th><th class="num">CTR</th></tr></thead><tbody>
  ${o.rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.type)}</td><td style="color:var(--fg2)">${esc(r.copy)}</td><td class="num">${f(r.spend)}</td><td class="num">${r.roas.toFixed(1)}${r.flag?'*':''}</td><td class="num">${r.purchases.toLocaleString('en-CA')}</td><td class="num">${r.ctr.toFixed(2)}%</td></tr>`).join('')}
  </tbody></table></div>
  <div class="note"><b>What it means for 2026.</b> Catalogue ads carried most of last year's BFCM spend, so the biggest win is a branded BF frame on DPA (style S09) with the angle rotating by phase. The two catalogue lines we ran map to A01 and A05 in the matrix. Quebec FR catalogue was small but efficient, so French versions are worth scaling.</div>`;
}
/* ---------- router ---------- */
function show(tab){['library','house','messaging','studio','ours'].forEach(t=>{$('#v-'+t).hidden=t!==tab;$('#t-'+t).setAttribute('aria-pressed',t===tab)});if(tab==='library')renderGrid();if(tab==='studio')renderStudio()}
function route(){const h=decodeURIComponent(location.hash.slice(1));
  if(/^(AT|DK|JD)-\d+$/.test(h)){const tab=h.startsWith('JD')?'studio':'library';if($('#v-'+tab).hidden)show(tab);openItem(h);return}
  $('#drawer').hidden=true;$('#scrim').hidden=true;show(h==='mockups'?'studio':['library','house','messaging','studio','ours'].includes(h)?h:'library')}
window.addEventListener('hashchange',route);
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>location.hash=b.dataset.tab);

/* ---------- hover interactions ---------- */
(()=>{
 const RM=matchMedia('(prefers-reduced-motion: reduce)').matches, HOVER=matchMedia('(hover:hover)').matches, CAP=8;
 document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.card,.scard');if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')},{passive:true});
 let cur=null;
 function start(t){if(cur&&cur!==t)stop(cur);cur=t;
  if(t.dataset.mp4){let v=t.querySelector('video.pv');if(!v){v=document.createElement('video');v.className='pv';v.muted=true;v.defaultMuted=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';v.src=t.dataset.mp4;
    const img=t.querySelector('img');if(img)v.poster=img.src;
    v.addEventListener('timeupdate',()=>{const d=Math.min(CAP,v.duration||CAP);t.querySelector('.pbar i').style.width=Math.min(100,v.currentTime/d*100)+'%';if(v.currentTime>=CAP)v.currentTime=0});
    v.addEventListener('ended',()=>{v.currentTime=0;v.play().catch(()=>{})});t.prepend(v)}
   v.currentTime=0;const pr=v.play();t.classList.add('playing');t.closest('.card')?.classList.add('live');if(pr)pr.catch(()=>t.classList.remove('playing'))}
  else if(t.classList.contains('pan')&&!RM){t.classList.add('panning');const b=t.querySelector('.pbar i');if(b){b.style.transition='none';b.style.width='0';requestAnimationFrame(()=>{b.style.transition='width 4.5s cubic-bezier(.45,0,.55,1)';b.style.width='100%'})}}}
 function stop(t){const v=t.querySelector('video.pv');if(v)v.pause();t.classList.remove('playing','panning');t.closest('.card')?.classList.remove('live');const b=t.querySelector('.pbar i');if(b){b.style.transition='none';b.style.width='0'}if(cur===t)cur=null}
 if(HOVER){
  document.addEventListener('pointerover',e=>{const c=e.target.closest&&e.target.closest('.card');if(!c||c.contains(e.relatedTarget))return;const t=c.querySelector('.thumb');if(t&&(t.dataset.mp4||t.classList.contains('pan')))start(t)});
  document.addEventListener('pointerout',e=>{const c=e.target.closest&&e.target.closest('.card');if(!c||c.contains(e.relatedTarget))return;const t=c.querySelector('.thumb');if(t)stop(t)});
 }else if('IntersectionObserver' in window&&!RM){
  /* touch: preview the video card that sits in the middle of the screen */
  const io=new IntersectionObserver(es=>es.forEach(en=>{const t=en.target;if(en.intersectionRatio>.75)start(t);else if(t===cur)stop(t)}),{threshold:[0,.75,1],rootMargin:'-20% 0px -20% 0px'});
  new MutationObserver(()=>document.querySelectorAll('#grid .thumb[data-mp4]:not([data-io])').forEach(t=>{t.dataset.io=1;io.observe(t)})).observe(document.getElementById('grid'),{childList:true});
  document.querySelectorAll('#grid .thumb[data-mp4]').forEach(t=>{t.dataset.io=1;io.observe(t)});
 }
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&cur)stop(cur)});
})();
</script>
